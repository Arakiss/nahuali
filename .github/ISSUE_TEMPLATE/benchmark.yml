name: Benchmark adapter or result
description: Propose an adapter, result, correction, or new case for the Agent Memory Trust Benchmark.
title: "benchmark: "
labels: ["benchmark"]
body:
  - type: dropdown
    id: change
    attributes:
      label: Contribution
      options: [New adapter, New result, Result correction, New case, Methodology question]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Memory system and version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Link the adapter source, immutable revision, exact command, and complete output when applicable.
    validations:
      required: true
