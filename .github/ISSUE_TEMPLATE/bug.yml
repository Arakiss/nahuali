name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make agent memory more reliable. Do not include secrets or irreplaceable memory data.
  - type: input
    id: version
    attributes:
      label: Nahuali version
      placeholder: Paste the output of nahuali --version
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, MCP, HTTP API, Rust core, Installer, Container]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe command sequence or MCP request that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Apple Silicon, embedded SurrealKV
    validations:
      required: true
