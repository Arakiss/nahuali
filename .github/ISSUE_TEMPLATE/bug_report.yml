name: Bug report
description: Something Nahuali does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: The command, what it said, and what you expected. Use invented data, never your real memory.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce it
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The commit you built from (`git rev-parse --short HEAD`), and your OS.
    validations:
      required: true
