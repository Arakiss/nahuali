name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for Conventional Commit validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version-policy:
    name: version policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Enforce one pre-1.0 product version
        run: bash scripts/check-version-policy.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The attestation surface is the product's differentiator; keep it linted
      # even though it is not in the default feature set.
      - run: cargo clippy -p nahuali-core --features attestation --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: bash scripts/ensure-dev-stack.sh && cargo test --workspace && cargo test -p nahuali-core --no-default-features --lib
          - os: macos-latest
            command: cargo test --workspace --no-run
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Start service-backed test dependencies
        run: bash scripts/ensure-dev-stack.sh
      - name: Measure workspace line coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info --fail-under-lines 75
      - name: Upload main coverage to Codecov with OIDC
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true

  release-gate:
    name: release/install dry-run gate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    # Keep this gate independent so it is queued with the rest of CI instead of
    # waiting until cheaper checks have already consumed the account minute
    # budget. `CI (all)` still requires it before a workflow can pass.
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Private memory dry-run helper interface
        timeout-minutes: 1
        run: bash scripts/private-memory-dry-run.sh --help
      - name: Start service-backed dev stack
        timeout-minutes: 3
        run: bash scripts/ensure-dev-stack.sh
      - name: Build API documentation
        timeout-minutes: 10
        run: cargo doc -p nahuali-core --no-deps
      - name: Package core crate
        timeout-minutes: 8
        run: cargo package -p nahuali-core --allow-dirty --no-verify
      - name: Build release artifacts
        timeout-minutes: 30
        run: bash scripts/release-dry-run.sh
      - name: Verify regression runner binary
        timeout-minutes: 1
        run: test -x target/release/nahuali-regression
      - name: Verify isolated install
        timeout-minutes: 20
        run: bash scripts/verify-install.sh
        env:
          NAHUALI_VALIDATE_SKIP_DEV_STACK: "1"
          NAHUALI_VERIFY_INSTALL_BIN_DIR: target/release
      - name: Verify CLI coexistence
        timeout-minutes: 5
        run: bash scripts/verify-cli-coexistence.sh
        env:
          NAHUALI_VALIDATE_SKIP_DEV_STACK: "1"
          NAHUALI_VERIFY_CLI_BIN_DIR: target/release
      - name: Verify private memory dry-run summary
        timeout-minutes: 8
        run: bash scripts/verify-private-memory-dry-run.sh
        env:
          NAHUALI_VALIDATE_SKIP_DEV_STACK: "1"
          NAHUALI_PRIVATE_DRY_RUN_BIN_DIR: target/release
      - name: Verify daily dogfood workflow
        timeout-minutes: 10
        run: bash scripts/verify-dogfood-daily-workflow.sh
        env:
          NAHUALI_VALIDATE_SKIP_DEV_STACK: "1"
          NAHUALI_DOGFOOD_BIN_DIR: target/release
      - name: Verify dogfood migration workflow
        timeout-minutes: 10
        run: bash scripts/verify-dogfood-migration.sh
        env:
          NAHUALI_VALIDATE_SKIP_DEV_STACK: "1"
          NAHUALI_DOGFOOD_BIN_DIR: target/release
      - name: Verify recall contract
        timeout-minutes: 5
        run: bash scripts/verify-recall-contract.sh
        env:
          NAHUALI_VALIDATE_SKIP_DEV_STACK: "1"
          NAHUALI_RECALL_CONTRACT_BIN_DIR: target/release
      - name: Check documentation release refs
        timeout-minutes: 1
        run: sh scripts/check-doc-release-refs.sh
      - name: Run regression fixtures
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/knowledge-health-${attempt}.json"
            bash scripts/run-regression-fixture.sh fixtures/knowledge-health-regression.json >"$log" 2>&1 || {
              cat "$log" >&2
              exit 1
            }
          done
          log="$RUNNER_TEMP/recall-regression.json"
          bash scripts/run-regression-fixture.sh fixtures/recall-regression.json >"$log" 2>&1 || {
            cat "$log" >&2
            exit 1
          }
        env:
          NAHUALI_REGRESSION_BIN_DIR: target/release
      - name: Run governance benchmark gate
        timeout-minutes: 15
        # LIVR/ARP/PCR/CDR/TVS — the numbers the README publishes. Recomputed
        # here so main cannot drift from the published table while CI is green.
        run: bash scripts/verify-governance-benchmarks.sh
      - name: Run security and supply-chain checks
        timeout-minutes: 5
        run: bash scripts/security-supply-chain-check.sh

  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-conventional-commits.sh "${BASE_SHA}..${HEAD_SHA}"

  ci-all:
    name: CI (all)
    runs-on: ubuntu-latest
    needs: [version-policy, fmt, clippy, test, coverage, release-gate, commits]
    if: ${{ always() }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Roll up job results
        id: rollup
        shell: bash
        run: |
          state="success"
          for result in \
            "${{ needs.version-policy.result }}" \
            "${{ needs.fmt.result }}" \
            "${{ needs.clippy.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.release-gate.result }}" \
            "${{ needs.commits.result }}"; do
            if [[ "$result" != "success" ]]; then
              state="failure"
            fi
          done

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          if [[ "$state" == "success" ]]; then
            echo "all CI jobs passed"
          else
            echo "at least one required CI job failed or was skipped"
          fi
      - name: Publish workflow dispatch commit status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLUP_STATE: ${{ steps.rollup.outputs.state || 'failure' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          state="${ROLLUP_STATE:-failure}"
          if [[ "$state" != "success" ]]; then
            state="failure"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="CI / workflow_dispatch" \
            -f description="CI ${state}" \
            -f target_url="$TARGET_URL"
      - name: Fail when required CI failed
        if: ${{ steps.rollup.outputs.state != 'success' }}
        run: exit 1
