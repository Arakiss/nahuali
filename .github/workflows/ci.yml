name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SURREAL_VERSION: v4.0.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history, for the release check and the commit lint.
          fetch-depth: 0
      - run: ops/release check
      - name: Commit messages and title are conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          ops/release lint "origin/${BASE}..HEAD"
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          ops/release lint --message "$RUNNER_TEMP/title"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SurrealDB
        run: |
          curl -sSfL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: surreal version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ops/privacy-check.sh
