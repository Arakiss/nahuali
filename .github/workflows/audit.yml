name: audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true
