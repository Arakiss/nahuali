[workspace]
members = [
  "crates/nahuali-core",
  "crates/nahuali-ui",
  "crates/nahuali-cli",
  "crates/nahuali-mcp",
  "crates/nahuali-api",
  "crates/nahuali-regression",
]
resolver = "3"

[workspace.package]
version = "0.1.0-beta.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Arakiss/nahuali"
homepage = "https://github.com/Arakiss/nahuali"
authors = ["Nahuali contributors"]

[workspace.dependencies]
nahuali-core = { version = "=2.0.0-beta.0", path = "crates/nahuali-core" }
nahuali-ui = { version = "=0.3.0-beta.0", path = "crates/nahuali-ui" }
anyhow = "1.0"
comfy-table = "7"
ratatui = "0.29"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = "3.0.5"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "1.5.0", features = ["server", "transport-io"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
