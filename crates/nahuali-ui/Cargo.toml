[package]
name = "nahuali-ui"
version.workspace = true
publish = false
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Clay-on-coffee terminal presentation layer for Nahuali — one visual identity shared across the CLI reports and the explore TUI"
keywords = ["cli", "tui", "terminal", "ui", "governance"]
categories = ["command-line-interface"]

[features]
# The interactive `explore` governance cockpit. Off by default so a minimal
# build (or a server context) need not pull ratatui; the CLI turns it on.
tui = ["dep:image", "dep:ratatui", "dep:ratatui-image"]

[dependencies]
comfy-table.workspace = true
image = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
ratatui-image = { workspace = true, optional = true }
