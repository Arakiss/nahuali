[package]
name = "nahuali-cli"
version = "0.3.0-beta.0"
publish = false
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native CLI for the Nahuali self-inspecting memory engine"
readme = "README.md"
keywords = ["agents", "memory", "cli", "recall", "governance"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nahuali"
path = "src/main.rs"

[features]
default = ["tui", "tamper-evidence"]
# The interactive `explore` governance cockpit (ratatui via nahuali-ui). On by
# default; build with --no-default-features to drop it (and ratatui) for a
# minimal/server CLI.
tui = ["nahuali-ui/tui"]
# Forward nahuali-core's tamper-evident hash chain. Off by default (default
# builds write byte-identical records). With this feature, recorded events are
# chained and `validate` detects an in-place rewrite of any historical record.
tamper-evidence = ["nahuali-core/tamper-evidence"]
# Forward the optional Ed25519 chain-tip attestation surface from nahuali-core.
# Implies `tamper-evidence`. Off by default: the `attest-sign` / `attest-verify`
# subcommands only exist in a build made with `--features attestation`.
attestation = ["nahuali-core/attestation", "tamper-evidence"]
# Forward nahuali-core's optional static model2vec embedder so `semantic-rebuild`
# and recall can use a local model for stronger semantic recall. Off by default
# (the deterministic embedder ships in every build); point
# NAHUALI_EMBEDDING_PROVIDER=model2vec and NAHUALI_LOCAL_EMBEDDING_MODEL_PATH at a
# model directory when built with this feature.
local-embeddings = ["nahuali-core/local-embeddings"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = "4.5"
nahuali-core.workspace = true
nahuali-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
