[package]
name = "nahuali-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The nahuali command: the verbs for agents and the board for a person"

[lints]
workspace = true

[[bin]]
name = "nahuali"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nahuali-core = { version = "0.1.0", path = "../nahuali-core" }
nahuali-tui = { version = "0.1.0", path = "../nahuali-tui" }
nahuali-view = { version = "0.1.0", path = "../nahuali-view" }
serde_json = "1"
surrealdb = { version = "4.0.1", default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[dev-dependencies]
ratatui = "0.30.2"
