[package]
name = "nahuali-mcp"
version.workspace = true
publish = false
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "MCP stdio server for the Nahuali self-inspecting memory engine"
readme = "README.md"
keywords = ["agents", "memory", "mcp", "recall", "governance"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nahuali-mcp"
path = "src/main.rs"

[features]
default = ["tamper-evidence", "attestation"]
# Forward the nahuali-core surfaces to match the flagship default posture and the
# published binary artifacts. Build with `--no-default-features` for a legacy
# unchained record format.
# - tamper-evidence: writes are chained, and the `validate` tool detects an
#   in-place rewrite of any historical record.
# - attestation: builds the core with the signable chain-tip surface so a default
#   `cargo build` of the whole workspace is chained and attestation-ready. The MCP
#   server exposes no signing tool; the feature only aligns the core build posture.
# - local-embeddings: static model2vec embedder for `semantic_rebuild` and recall.
tamper-evidence = ["nahuali-core/tamper-evidence"]
attestation = ["nahuali-core/attestation", "tamper-evidence"]
local-embeddings = ["nahuali-core/local-embeddings"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
nahuali-core.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
