[package]
name = "nahuali-regression"
version = "1.1.0-beta.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Internal regression fixture runner for the Nahuali Rust core"
publish = false

[[bin]]
name = "nahuali-regression"
path = "src/main.rs"

[features]
# On by default to match the flagship posture: a plain `cargo build` of the
# regression runner enables the `--livr` integrity report. Drop with
# `--no-default-features` for the minimal runner.
default = ["attestation"]
# Enable the `--livr` integrity report. The Ledger Integrity Verification Rate
# needs the attestation-tip detector tier, so it forwards to the core feature.
attestation = ["nahuali-core/attestation"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
nahuali-core = { workspace = true, features = ["regression-fixtures"] }
serde.workspace = true
serde_json.workspace = true
