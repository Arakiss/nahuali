[package]
name = "nahuali-api"
version.workspace = true
publish = false
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HTTP API for the Nahuali self-inspecting memory engine"
readme = "README.md"
keywords = ["agents", "memory", "api", "recall", "governance"]
categories = ["web-programming::http-server", "development-tools"]

[[bin]]
name = "nahuali-api"
path = "src/main.rs"

[features]
default = ["tamper-evidence", "attestation"]
# Forward the nahuali-core surfaces to match the published binary artifacts.
# Build with `--no-default-features` for a legacy
# unchained record format.
# - tamper-evidence: writes are chained, and replay detects a rewritten non-tip
#   record when the following link was not recomputed. External checkpoints are
#   needed for rollback, last-event rewrite, and full re-chains.
# - attestation: builds the core with the signable chain-tip surface so a default
#   `cargo build` of the whole workspace is chained and attestation-ready. The API
#   exposes no signing endpoint; the feature only aligns the core build posture.
# - local-embeddings: static model2vec embedder for `/v1/semantic/rebuild` and
#   semantic recall.
tamper-evidence = ["nahuali-core/tamper-evidence"]
attestation = ["nahuali-core/attestation", "tamper-evidence"]
local-embeddings = ["nahuali-core/local-embeddings"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
nahuali-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync"] }

[dev-dependencies]
tower.workspace = true
