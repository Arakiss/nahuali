[package]
name = "nahuali-api"
version = "0.4.1-beta.0"
publish = false
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HTTP API for the Nahuali self-inspecting memory engine"
readme = "README.md"
keywords = ["agents", "memory", "api", "recall", "governance"]
categories = ["web-programming::http-server", "development-tools"]

[[bin]]
name = "nahuali-api"
path = "src/main.rs"

[features]
default = ["tamper-evidence"]
# Forward the nahuali-core optional surfaces that have an observable effect on the
# API surface. `tamper-evidence` is on by default to match the CLI and published
# binary artifacts; build with `--no-default-features` for the legacy unchained
# record format.
# - tamper-evidence: writes are chained, and ledger replay on open detects an
#   in-place rewrite of any historical record.
# - local-embeddings: static model2vec embedder for `/v1/semantic/rebuild` and
#   semantic recall.
# Tip attestation is intentionally not forwarded: it is a CLI/operator action and
# the API exposes no signing endpoint.
tamper-evidence = ["nahuali-core/tamper-evidence"]
local-embeddings = ["nahuali-core/local-embeddings"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
nahuali-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tower.workspace = true
